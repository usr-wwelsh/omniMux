services:
  navidrome:
    image: deluan/navidrome:latest
    ports:
      - "4533:4533"
    volumes:
      - ./data/navidrome:/data
      - ./data/music:/music
    environment:
      ND_SCANSCHEDULE: "@every 1h"
      ND_LOGLEVEL: warn
      ND_BASEURL: ""
      # Every miss here is a re-resize, and enough simultaneous re-resizes is
      # what makes Navidrome start rejecting artwork requests outright.
      ND_IMAGECACHESIZE: "500MB"
      ND_TRANSCODINGCACHESIZE: "0"
    restart: unless-stopped

  omnimux-api:
    build: ./api
    ports:
      - "8800:8800"
    volumes:
      - ./data/music:/music
      - ./data/omnimux:/data
      # Opt-in auto-update helper's socket (see deploy/README.md). A no-op
      # until deploy/install.sh has run: Docker just creates an empty
      # directory here, and the api container notices there's no socket in
      # it and stays quiet.
      - /run/omnimux-updater:/run/omnimux-updater:ro
    environment:
      NAVIDROME_URL: http://navidrome:4533
      MUSIC_DIR: /music
      DATA_DIR: /data
      # Both read from .env (gitignored, copy from .env.example) — never
      # edit the values in this tracked file directly, or a future `git
      # pull` will conflict with your own secrets.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      MALLOC_ARENA_MAX: 2
      MALLOC_TRIM_THRESHOLD_: 131072
    depends_on:
      - navidrome
    restart: unless-stopped

  omnimux-web:
    build: ./web
    ports:
      - "8801:80"
    depends_on:
      - omnimux-api
    restart: unless-stopped
