services:
  navidrome:
    image: deluan/navidrome:latest
    ports:
      - "4533:4533"
    volumes:
      - ./data/navidrome:/data
      - ./data/music:/music
    environment:
      ND_SCANSCHEDULE: "@every 1h"
      ND_LOGLEVEL: warn
      ND_BASEURL: ""
      # Every miss here is a re-resize, and enough simultaneous re-resizes is
      # what makes Navidrome start rejecting artwork requests outright.
      ND_IMAGECACHESIZE: "500MB"
      ND_TRANSCODINGCACHESIZE: "0"
    restart: unless-stopped

  omnimux-api:
    build: ./api
    ports:
      - "8800:8800"
    volumes:
      - ./data/music:/music
      - ./data/omnimux:/data
      # Opt-in auto-update banner — see deploy/README.md. Uncomment once
      # omnimux-updater.service is installed on the host; leave commented
      # out and the update banner simply never appears.
      # - /run/omnimux-updater:/run/omnimux-updater:ro
    environment:
      NAVIDROME_URL: http://navidrome:4533
      MUSIC_DIR: /music
      DATA_DIR: /data
      JWT_SECRET: change-me-in-production
      MALLOC_ARENA_MAX: 2
      MALLOC_TRIM_THRESHOLD_: 131072
      # Must match OMNIMUX_UPDATER_TOKEN in /etc/omnimux/updater.env — see deploy/README.md.
      # UPDATER_TOKEN: change-me-in-production
    depends_on:
      - navidrome
    restart: unless-stopped

  omnimux-web:
    build: ./web
    ports:
      - "8801:80"
    depends_on:
      - omnimux-api
    restart: unless-stopped
