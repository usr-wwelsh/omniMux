services:
  navidrome:
    image: deluan/navidrome:latest
    ports:
      - "4533:4533"
    volumes:
      - ./data/navidrome:/data
      - ./data/music:/music
    environment:
      ND_SCANSCHEDULE: "@every 1h"
      ND_LOGLEVEL: warn
      ND_BASEURL: ""
      # Every miss here is a re-resize, and enough simultaneous re-resizes is
      # what makes Navidrome start rejecting artwork requests outright.
      ND_IMAGECACHESIZE: "500MB"
      ND_TRANSCODINGCACHESIZE: "0"
    restart: unless-stopped

  omnimux-api:
    build: ./api
    ports:
      - "8800:8800"
    volumes:
      - ./data/music:/music
      - ./data/omnimux:/data
    environment:
      NAVIDROME_URL: http://navidrome:4533
      MUSIC_DIR: /music
      DATA_DIR: /data
      JWT_SECRET: change-me-in-production
      MALLOC_ARENA_MAX: 2
      MALLOC_TRIM_THRESHOLD_: 131072
    # Opt-in auto-update banner (off by default, nothing above changes): run
    # deploy/install.sh, which drops a docker-compose.override.yml next to
    # this file — Compose merges it automatically, no editing needed here.
    # See deploy/README.md.
    depends_on:
      - navidrome
    restart: unless-stopped

  omnimux-web:
    build: ./web
    ports:
      - "8801:80"
    depends_on:
      - omnimux-api
    restart: unless-stopped
