server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Text payloads ship gzipped; brotli isn't available in the stock image.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Baseline security headers. nginx drops inherited add_headers the moment a
    # block declares its own, so the index/asset blocks below repeat these.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://omnimux-api:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Media proxy: stream/cover. Disable buffering so Range requests and
    # seeking work, and allow long-lived audio connections.
    location /api/library/ {
        proxy_pass http://omnimux-api:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    # The SPA shell must revalidate every load or clients keep serving a stale
    # bundle after an update. Internal try_files fallbacks re-enter this block.
    #
    # Social-card meta tags are baked at build time with a placeholder origin
    # (the same static index.html is shipped to every self-hosted instance),
    # so rewrite it here to whatever host the request actually came in on.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        sub_filter '__OMNIMUX_ORIGIN__' '$scheme://$host';
        sub_filter_once off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
